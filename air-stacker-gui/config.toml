# Air Stacker GUI configuration.

[gentl]
# Path to a GenTL producer .cti file, or a directory containing one.
# The Air Stacker PC has Spinnaker installed; its producers live under cti64/vs2015.
producer = 'C:\Program Files\FLIR Systems\Spinnaker\cti64\vs2015'

[camera]
# Zero-based index into the producer's enumerated device list.
device_index = 0
# Defaults applied at startup. Per gui-notes on the Air Stacker PC.
gain = 10.0
exposure_us = 5000.0
# Auto white balance is "Continuous" by default; gain/exposure auto are "Off".

# CONEX-CC axes. Each entry is one controller on its own COM port (address 1 by convention).
# Z vs spin assignment is unconfirmed — rename and reorder once we identify the stages.
[[axis]]
name = "Axis A"
port = "COM3"
baud = 921600
units = "mm"
step = 0.01

[[axis]]
name = "Axis B"
port = "COM4"
baud = 921600
units = "mm"
step = 0.01

# Omega Platinum heater controller (Modbus RTU over USB CDC).
[heater]
port = "COM7"
baud = 19200
slave_id = 1
units = "°C"
poll_interval_ms = 1000
