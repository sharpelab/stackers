# Air Stacker GUI configuration.

[camera]
# Zero-based index into the producer's enumerated device list.
device_index = 0
# Other startup camera defaults (gain, exposure, WB ratios, autos) live in
# OUR_DEFAULTS in main.py. Re-add `gain = ...` / `exposure_us = ...` here
# only if a per-deployment override is needed.

# USB webcam — display-only secondary viewer. Live toggle in the bottom
# StatusBar opens/closes a detached window. Currently configured for the
# Anker PowerConf C200 (see docs/air-stacker-pc.md "Secondary camera").
# Design rationale: WEBCAM_PIP_PROPOSAL.md.
[webcam]
# Skip the webcam entirely (no UI button shown). Default: true (toggle visible).
enabled = true
# Device matching — Qt Multimedia identifies cameras by description.
# Substring match, case-insensitive. Survives USB-port reshuffles.
device_description = "Anker PowerConf C200"
# Exact-id override (use only if multiple cameras share a description).
# device_id = "\\\\?\\usb#vid_291a&pid_3369&mi_00#..."

# Capture format. 1280x720 NV12 @ 30 fps is the validated default on the
# Anker C200 (probed 2026-05-10). NV12 preferred over MJPEG (no decode)
# and over YUYV (cv2 probe showed YUYV caps below 1080p).
width = 1280
height = 720
target_fps = 30
pixel_format = "NV12"        # "NV12" | "MJPEG" | "YUYV"

# Whether the window opens on app launch. Default: false (operator clicks
# the StatusBar toggle when they want it).
default_visible = false

# Capture backend. "qt" (PySide6.QtMultimedia, recommended) | "cv2"
# (fallback; not implemented in v0). The Qt path uses Media Foundation
# on Windows.
backend = "qt"

# Per-machine state (window geometry, user-created camera/image presets)
# lives in the untracked sibling file settings.toml, not here. See
# .gitignore.

# CONEX-CC axes. Each entry is one controller on its own COM port (address 1 by convention).
# Axis A on COM3 is currently disconnected — re-add a [[axis]] entry when it's wired up:
#   name = "Axis A", port = "COM3", baud = 921600, units = "mm", step = 0.01
[[axis]]
name = "Rotation Stage"
port = "COM4"
baud = 921600
units = "°"
step = 0.01
# Transient (VA only) — applied on connect, no flash write.
default_velocity = 1.0

# Omega Platinum heater controller (Modbus RTU over USB CDC).
[heater]
port = "COM7"
baud = 19200
slave_id = 1
units = "°C"
poll_interval_ms = 1000

# Newport SMC100CC Z-axis motion controller (RS-232C → USB-RS232).
# `position_limits` is the operational software cap. Stay within the rig's
# 30 mm safe travel envelope (see docs/air-stacker-pc.md "Z stage — SMC100CC").
# The controller's ESP-loaded SL/SR are wider (-0.1 to +50.1 mm); the panel
# enforces this tighter range without writing it to the controller.
[smc100]
port = "COM5"
baud = 57600
units = "mm"
step = 0.1
poll_interval_ms = 100
position_limits = [0.0, 30.0]
# LTA-HS RMS-current-trip floor. At velocities below ~5 µm/s the servo
# holds enough sustained current that the SMC100's protective trip fires
# after ~10 s of motion, dropping out of MOVING into NOT REFERENCED and
# forcing a re-home. mm/s for consistency with default_velocity.
min_velocity = 0.005

# Yokogawa 7651 → NPM140 piezo (fine-Z axis), GPIB.
# Panel operates the Yoko as a **constant-current source**: the piezo
# voltage evolves as dV/dt = I/C, the Keithley 617 (across the piezo
# terminals, DCV mode) provides voltage feedback for closed-loop
# control. See docs/air-stacker-pc.md "Z stage — fine (Yokogawa 7651 +
# NPM140)".
#
# voltage_limits is the piezo-safety window enforced in software:
# −20 V is the NPM140 hard floor (anything below damages the piezo,
# and the Yoko itself can swing to −30 V — no hardware protection).
# +30 V is the Yoko's own compliance ceiling (so the +30 V side is
# also a hardware limit, but tripping it just means the source ran
# out of headroom, not damage). nm_per_volt comes from the NPM140
# datasheet (140 µm / 150 V span).
[yoko]
resource = "GPIB0::15::INSTR"
voltage_limits = [-20.0, 30.0]
nm_per_volt = 933.33
poll_interval_ms = 1000

# NPM140 capacitance — measured 2026-05-11 by ramping V at constant
# +1 µA and observing the slope (0.49 V/s implies C = 2.0 µF). The
# datasheet quotes 1.7 µF ±20 %, so 2.0 sits at the high end of the
# tolerance band but is consistent with it. Used by the watchdog's
# predictive floor trip (v_pred = v + i·(dt+slack)/C); the wrong
# value under-protects against the −20 V hard limit.
piezo_capacitance_uf = 2.0

# Speed used by the on-close shutdown ramp (open-loop, sources
# default_speed_a opposite-sign of current V until V_after_stop
# crosses zero — predictive bail accounts for the Yoko's τ ≈ 0.6 s
# settling lag, see YOKO_SETTLE_S in yoko_panel.py). 2.5 µA on 2 µF
# = 1.25 V/s, so a 30 V wind-down takes ~24 s. Slower gives smaller
# residual offset from 0; the operator-facing Start uses the Current
# slider directly, bounded by [-max_speed_a, +max_speed_a].
default_speed_a = 2.5e-6      # 2.5 µA, shutdown ramp only
max_speed_a = 5e-6            # 5 µA — Current slider upper bound. The
                              # slider snaps to ticks at 0.5/1.0/2.5/5.0
                              # µA. At 5 µA into 2 µF the worst-case
                              # one-cycle (333 ms) ΔV ≈ 0.83 V, well
                              # inside safety_margin_v=1.5 — predictive
                              # trip still has a clean intercept.

# Safety margin (in V) between the predictive-floor trip and the
# hard voltage_limits[0]. Soft floor = voltage_limits[0] + this.
# Sized to cover the unanticipated ΔV during one 617 conversion at
# max_speed_a (~0.83 V at 5 µA into 2 µF; ±20 % C tolerance + scheduling
# jitter absorbed by the remaining 0.7 V headroom).
safety_margin_v = 1.5

# Watchdog: if the 617 hasn't returned a fresh reading in this long,
# Start refuses (no V feedback → no predictive safety). The 617's
# native conversion time is 330 ms, so anything < 500 ms is a real
# comm-loss signal.
move_stale_ms = 1000

# Keithley 617 electrometer across the piezo terminals (live voltage
# readback; 200 TΩ input keeps loading negligible). Optional — drop
# this block to hide the 617 readout in the Yoko panel. See
# docs/air-stacker-pc.md "Voltage readback — Keithley 617" for the
# wiring.
#
# poll_interval_ms is a FLAT gap inserted after each read (not a target
# period): effective cadence = read_time + interval. The 617 talks at its
# conversion rate (~3 Hz / 333 ms) and each inst.read() blocks for the next
# one — so a small gap doesn't cost a fresh reading, the read already waits
# for it. 50 ms keeps the 617 from pegging the GPIB bus back-to-back, which
# leaves room for the Yoko's 1 Hz OD; query and reduces the bus-contention
# window. Don't raise it much: ~333 ms read + interval sets the watchdog's
# V-feedback rate (predictive trip + move/jog staleness). 0 = as fast as the
# 617 emits (old default — hammered the bus; see the recurring GPIB-wedge
# investigation 2026-06-03).
# GPIB primary 27 is the 617's factory default. It reverted from the
# previously-set 29 on a cold power-cycle (2026-06-10) — likely a dead NVRAM
# backup battery, so it boots to 27 every time. Config tracks 27 rather than
# re-setting 29 at the front panel after each power-cycle.
[yoko.keithley617]
resource = "GPIB0::27::INSTR"
poll_interval_ms = 50
