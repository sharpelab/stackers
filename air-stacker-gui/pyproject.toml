[project]
name = "air-stacker-gui"
version = "0.1.0"
description = "Custom microscope viewer + recorder for the Air Stacker"
requires-python = ">=3.10"
dependencies = [
    "harvesters>=1.4",
    "pyside6>=6.3",
    "numpy>=1.22",
    "opencv-python>=4.5",
    "tomli>=2.0; python_version < '3.11'",
    "pyserial>=3.5",
]
