[project]
name = "air-stacker-gui"
version = "0.1.0"
description = "Custom microscope viewer + recorder for the Air Stacker"
requires-python = ">=3.13,<3.14"
dependencies = [
    "harvesters>=1.4",
    "pyside6>=6.3",
    "numpy>=1.22",
    "opencv-python>=4.5",
    "pyserial>=3.5",
    "minimalmodbus>=2.1",
    "superqt>=0.8.1",
]

[project.gui-scripts]
# On Windows, gui-scripts entry points generate a pythonw-based .exe
# wrapper, so launching from a shortcut doesn't flash a console window.
air-stacker-gui = "main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# Flat layout: main.py + conex.py at the root, heater as a subpackage.
packages = ["heater"]
include = ["main.py", "conex.py"]

[dependency-groups]
dev = [
    "ruff>=0.7",
    "ty>=0.0.1a1",
]
