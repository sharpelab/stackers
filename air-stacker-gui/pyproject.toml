[project]
name = "air-stacker-gui"
version = "0.1.0"
description = "Custom microscope viewer + recorder for the Air Stacker"
requires-python = ">=3.13,<3.14"
dependencies = [
    "harvesters>=1.4",
    "pyside6>=6.3",
    "numpy>=1.22",
    "opencv-python>=4.5",
    "pyserial>=3.5",
    "minimalmodbus>=2.1",
    "superqt>=0.8.1",
]

[dependency-groups]
dev = [
    "ruff>=0.7",
    "ty>=0.0.1a1",
]
