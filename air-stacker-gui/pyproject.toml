[project]
name = "air-stacker-gui"
version = "0.1.0"
description = "Custom microscope viewer + recorder for the Air Stacker"
requires-python = ">=3.10,<3.11"
# PySpin (FLIR Spinnaker SDK Python bindings) is NOT on PyPI; FLIR ships
# it as a wheel that must be downloaded from the Spinnaker SDK page. We
# vendor the Windows cp310 wheel under vendor/ and reference it via
# [tool.uv.sources] below — uv sync installs it automatically on win32.
# numpy is pinned <2 because PySpin 4.3 is built against NumPy 1.x.
dependencies = [
    "pyside6>=6.3",
    "numpy>=1.22,<2",
    "opencv-python>=4.5",
    "pyserial>=3.5",
    "pyvisa>=1.13",
    "minimalmodbus>=2.1",
    "superqt>=0.8.1",
    "tomlkit>=0.13",
    "spinnaker-python; sys_platform == 'win32' or sys_platform == 'linux'",
]

[project.gui-scripts]
# On Windows, gui-scripts entry points generate a pythonw-based .exe
# wrapper, so launching from a shortcut doesn't flash a console window.
air-stacker-gui = "main:main"

[tool.uv.sources]
spinnaker-python = [
    { path = "vendor/spinnaker_python-4.3.0.190-cp310-cp310-win_amd64.whl", marker = "sys_platform == 'win32'" },
    { path = "vendor/spinnaker_python-4.3.0.189-cp310-cp310-linux_x86_64.whl", marker = "sys_platform == 'linux'" },
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# Flat layout: main.py + conex.py at the root, heater as a subpackage.
packages = ["heater"]
include = ["main.py", "conex.py"]

[dependency-groups]
dev = [
    "ruff>=0.7",
    "ty>=0.0.1a1",
]
